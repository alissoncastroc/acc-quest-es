<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCQuestões - Plataforma de Estudos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">ACCQuestões</h1>
                    <p class="text-xs text-slate-400">Plataforma de Questões para Concursos</p>
                </div>
            </div>
            <!-- Estatísticas Rápidas -->
            <div class="flex gap-4 text-sm bg-slate-900/50 px-4 py-2 rounded-lg border border-slate-700/50">
                <div><span class="text-slate-400">Total:</span> <span id="stat-total" class="font-bold text-blue-400">0</span></div>
                <div><span class="text-slate-400">Respondidas:</span> <span id="stat-respondidas" class="font-bold text-emerald-400">0</span></div>
                <div><span class="text-slate-400">Acertos:</span> <span id="stat-acertos" class="font-bold text-green-400">0%</span></div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Filtros Laterais -->
        <aside class="lg:col-span-1 bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit space-y-4">
            <h2 class="font-semibold text-lg border-b border-slate-700 pb-2 flex items-center gap-2">
                <i class="fa-solid fa-filter text-blue-500"></i> Filtrar Questões
            </h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Disciplina</label>
                <select id="filtro-disciplina" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <option value="">Todas as Disciplinas</option>
                </select>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Banca</label>
                <select id="filtro-banca" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <option value="">Todas as Bancas</option>
                </select>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Cargo</label>
                <select id="filtro-cargo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <option value="">Todos os Cargos</option>
                </select>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Dificuldade</label>
                <select id="filtro-dificuldade" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                    <option value="">Todas</option>
                    <option value="Fácil">Fácil</option>
                    <option value="Média">Média</option>
                    <option value="Difícil">Difícil</option>
                </select>
            </div>

            <button onclick="aplicarFiltros()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition text-sm">
                Filtrar Questões
            </button>
        </aside>

        <!-- Lista de Questões -->
        <section class="lg:col-span-3 space-y-6" id="container-questoes">
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p>Carregando questões da base de dados...</p>
            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-500 mt-auto">
        ACCQuestões &copy; 2026 - Todos os direitos reservados.
    </footer>

    <!-- Script de Integração e Lógica -->
    <script>
        // COLE A SUA NOVA URL DO GOOGLE APPS SCRIPT ABAIXO ENTRE AS ASPAS:
        const API_URL = "SUA_NOVA_URL_DO_GAS_AQUI";

        let todasQuestoes = [];
        let questoesFiltradas = [];
        let estatisticas = { respondidas: 0, acertos: 0 };

        async function carregarQuestoes() {
            try {
                const resposta = await fetch(API_URL);
                const dados = await resposta.json();
                todasQuestoes = dados;
                questoesFiltradas = dados;
                
                atualizarEstatisticas();
                popularFiltros(dados);
                exibirQuestoes(dados);
            } catch (erro) {
                document.getElementById('container-questoes').innerHTML = `
                    <div class="bg-red-900/30 border border-red-700 p-4 rounded-xl text-center text-red-300">
                        <p class="font-bold">Erro ao carregar as questões.</p>
                        <p class="text-xs mt-1">Verifique se a URL do Apps Script está correta e com acesso público.</p>
                    </div>`;
            }
        }

        function popularFiltros(dados) {
            const disciplinas = [...new Set(dados.map(q => q.disciplina))].filter(Boolean);
            const bancas = [...new Set(dados.map(q => q.banca))].filter(Boolean);
            const cargos = [...new Set(dados.map(q => q.cargo))].filter(Boolean);

            preencherSelect('filtro-disciplina', disciplinas);
            preencherSelect('filtro-banca', bancas);
            preencherSelect('filtro-cargo', cargos);
        }

        function preencherSelect(id, itens) {
            const select = document.getElementById(id);
            itens.sort().forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                select.appendChild(opt);
            });
        }

        function aplicarFiltros() {
            const disc = document.getElementById('filtro-disciplina').value;
            const banca = document.getElementById('filtro-banca').value;
            const cargo = document.getElementById('filtro-cargo').value;
            const dif = document.getElementById('filtro-dificuldade').value;

            questoesFiltradas = todasQuestoes.filter(q => {
                return (!disc || q.disciplina === disc) &&
                       (!banca || q.banca === banca) &&
                       (!cargo || q.cargo === cargo) &&
                       (!dif || q.dificuldade === dif);
            });

            exibirQuestoes(questoesFiltradas);
        }

        function exibirQuestoes(questoes) {
            const container = document.getElementById('container-questoes');
            document.getElementById('stat-total').textContent = questoes.length;

            if (questoes.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-6 rounded-xl text-center text-slate-400">Nenhuma questão encontrada com esses filtros.</div>`;
                return;
            }

            container.innerHTML = questoes.map((q, index) => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md" id="questao-${q.id || index}">
                    <div class="flex flex-wrap gap-2 mb-3 text-xs">
                        <span class="bg-blue-900/60 text-blue-300 px-2.5 py-1 rounded-md font-medium">${q.disciplina || 'Geral'}</span>
                        <span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">${q.banca || 'Não informada'}</span>
                        <span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">${q.cargo || 'Diversos'}</span>
                        <span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">${q.dificuldade || 'Média'}</span>
                    </div>
                    <p class="text-slate-200 text-sm md:text-base mb-4 leading-relaxed">${q.enunciado}</p>
                    
                    <div class="space-y-2 mb-4" id="opcoes-${q.id || index}">
                        ${q.opcoes.map((opt, i) => {
                            const letra = String.fromCharCode(65 + i);
                            return `
                                <label class="flex items-start gap-3 p-3 rounded-lg border border-slate-700/60 bg-slate-900/40 hover:bg-slate-700/30 cursor-pointer transition text-sm">
                                    <input type="radio" name="pergunta-${q.id || index}" value="${letra}" class="mt-1">
                                    <span><strong>${letra})</strong> ${opt}</span>
                                </label>`;
                        }).join('')}
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-slate-700/50">
                        <button onclick="responder('${q.gabarito}', '${q.explicacao}', '${q.id || index}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-4 py-2 rounded-lg transition">
                            Responder
                        </button>
                        <div id="resultado-${q.id || index}" class="text-xs font-semibold"></div>
                    </div>
                </div>
            `).join('');
        }

        function responder(gabaritoCorreto, explicacao, id) {
            const selecionada = document.querySelector(`input[name="pergunta-${id}"]:checked`);
            const divResultado = document.getElementById(`resultado-${id}`);

            if (!selecionada) {
                alert("Selecione uma alternativa antes de responder!");
                return;
            }

            estatisticas.respondidas++;
            if (selecionada.value.trim().toUpperCase() === gabaritoCorreto.trim().toUpperCase()) {
                estatisticas.acertos++;
                divResultado.innerHTML = `<span class="text-green-400 font-bold"><i class="fa-solid fa-check"></i> Correto! Gabarito: ${gabaritoCorreto}</span>`;
            } else {
                divResultado.innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-xmark"></i> Incorreto. Gabarito: ${gabaritoCorreto}</span>`;
            }

            if (explicacao && explicacao !== "undefined" && explicacao !== "") {
                divResultado.innerHTML += `<div class="text-slate-300 text-xs mt-2 bg-slate-900/80 p-2.5 rounded-lg border border-slate-700"><strong>Explicação:</strong> ${explicacao}</div>`;
            }

            atualizarEstatisticas();
        }

        function atualizarEstatisticas() {
            document.getElementById('stat-respondidas').textContent = estatisticas.respondidas;
            const porc = estatisticas.respondidas > 0 ? Math.round((estatisticas.acertos / estatisticas.respondidas) * 100) : 0;
            document.getElementById('stat-acertos').textContent = porc + '%';
        }

        carregarQuestoes();
    </script>
</body>
</html>
