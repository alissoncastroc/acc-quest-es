<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCQuestões - Banco de Questões</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Topo / Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-brain text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">ACC<span class="text-blue-500">Questões</span></h1>
                    <p class="text-xs text-slate-400">Plataforma Inteligente de Estudos</p>
                </div>
            </div>

            <!-- Dashboard de Estatísticas no Topo -->
            <div class="flex items-center gap-3 bg-slate-900/80 px-4 py-1.5 rounded-xl border border-slate-800 text-xs shadow-inner">
                <div class="flex items-center gap-1.5"><span class="text-slate-400">Total:</span> <span id="stat-total" class="font-bold text-blue-400">0</span></div>
                <div class="h-3 w-px bg-slate-800"></div>
                <div class="flex items-center gap-1.5"><span class="text-slate-400">Respondidas:</span> <span id="stat-respondidas" class="font-bold text-indigo-400">0</span></div>
                <div class="h-3 w-px bg-slate-800"></div>
                <div class="flex items-center gap-1.5"><span class="text-slate-400">Acertos:</span> <span id="stat-acertos" class="font-bold text-emerald-400">0%</span></div>
            </div>
        </div>
    </header>

    <!-- Corpo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
        
        <!-- Barra Lateral de Filtros Avançados -->
        <aside class="lg:col-span-1 bg-slate-900/90 p-5 rounded-2xl border border-slate-800/80 shadow-xl space-y-4 sticky top-20">
            <h2 class="font-semibold text-sm uppercase tracking-wider text-slate-300 border-b border-slate-800 pb-2.5 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-blue-500"></i> Filtrar Questões
            </h2>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Disciplina</label>
                    <select id="filtro-disciplina" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <option value="">Todas as Disciplinas</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Banca</label>
                    <select id="filtro-banca" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <option value="">Todas as Bancas</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Cargo</label>
                    <select id="filtro-cargo" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <option value="">Todos os Cargos</option>
                    </select>
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Dificuldade</label>
                    <select id="filtro-dificuldade" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                        <option value="">Todas</option>
                        <option value="Fácil">Fácil</option>
                        <option value="Média">Média</option>
                        <option value="Difícil">Difícil</option>
                    </select>
                </div>
            </div>

            <button onclick="aplicarFiltros()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-xl transition text-xs shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-filter"></i> Aplicar Filtros
            </button>
            <button onclick="limparFiltros()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl transition text-xs">
                Limpar Filtros
            </button>
        </aside>

        <!-- Container de Listagem das Questões -->
        <section class="lg:col-span-3 space-y-6" id="container-questoes">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-400 shadow-xl">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
                <p class="text-sm">Buscando questões direto da planilha...</p>
            </div>
        </section>

    </main>

    <!-- Rodapé -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-500 mt-auto">
        ACCQuestões &copy; 2026 - Todos os direitos reservados.
    </footer>

    <!-- Lógica JavaScript do Sistema -->
    <script>
        // COLE A SUA NOVA URL DO GOOGLE APPS SCRIPT ABAIXO ENTRE AS ASPAS:
        const API_URL = "https://script.google.com/macros/s/AKfycbwzh4Bb9R0QbSb0Q3FQ8BfpyV4nVLW3xfIvQVHhvnCiMharugL4qfC47TUqRdpilTgZ/exec";

        let todasQuestoes = [];
        let questoesFiltradas = [];
        let estatisticas = { respondidas: 0, acertos: 0 };

        async function carregarQuestoes() {
            try {
                const resposta = await fetch(API_URL);
                const dados = await resposta.json();
                
                if (dados.error) throw new Error(dados.error);

                todasQuestoes = dados;
                questoesFiltradas = dados;
                
                atualizarEstatisticas();
                popularFiltros(dados);
                exibirQuestoes(dados);
            } catch (erro) {
                document.getElementById('container-questoes').innerHTML = `
                    <div class="bg-red-950/40 border border-red-900/60 p-6 rounded-2xl text-center text-red-300 shadow-xl">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-red-500"></i>
                        <p class="font-bold text-sm">Erro ao carregar as questões da planilha.</p>
                        <p class="text-xs mt-1 text-red-400">Verifique se a URL do Apps Script está correta e se a implantação está liberada para "Qualquer pessoa".</p>
                    </div>`;
            }
        }

        function popularFiltros(dados) {
            const disciplinas = [...new Set(dados.map(q => q.disciplina))].filter(Boolean);
            const bancas = [...new Set(dados.map(q => q.banca))].filter(Boolean);
            const cargos = [...new Set(dados.map(q => q.cargo))].filter(Boolean);

            preencherSelect('filtro-disciplina', disciplinas);
            preencherSelect('filtro-banca', bancas);
            preencherSelect('filtro-cargo', cargos);
        }

        function preencherSelect(id, itens) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="">Todos</option>` + itens.sort().map(item => `<option value="${item}">${item}</option>`).join('');
        }

        function aplicarFiltros() {
            const disc = document.getElementById('filtro-disciplina').value;
            const banca = document.getElementById('filtro-banca').value;
            const cargo = document.getElementById('filtro-cargo').value;
            const dif = document.getElementById('filtro-dificuldade').value;

            questoesFiltradas = todasQuestoes.filter(q => {
                return (!disc || q.disciplina === disc) &&
                       (!banca || q.banca === banca) &&
                       (!cargo || q.cargo === cargo) &&
                       (!dif || q.dificuldade === dif);
            });

            exibirQuestoes(questoesFiltradas);
        }

        function limparFiltros() {
            document.getElementById('filtro-disciplina').value = "";
            document.getElementById('filtro-banca').value = "";
            document.getElementById('filtro-cargo').value = "";
            document.getElementById('filtro-dificuldade').value = "";
            questoesFiltradas = todasQuestoes;
            exibirQuestoes(questoesFiltradas);
        }

        function exibirQuestoes(questoes) {
            const container = document.getElementById('container-questoes');
            document.getElementById('stat-total').textContent = questoes.length;

            if (questoes.length === 0) {
                container.innerHTML = `<div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center text-slate-400 shadow-xl text-sm">Nenhuma questão encontrada com estes filtros.</div>`;
                return;
            }

            container.innerHTML = questoes.map((q, index) => `
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-6 shadow-xl space-y-4" id="questao-${q.id || index}">
                    <div class="flex flex-wrap gap-2 text-xs">
                        <span class="bg-blue-950 text-blue-300 border border-blue-900/50 px-2.5 py-1 rounded-lg font-medium">${q.disciplina || 'Geral'}</span>
                        <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">${q.banca || 'Banca não informada'}</span>
                        <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">${q.cargo || 'Cargo geral'}</span>
                        <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">${q.ano || ''}</span>
                        <span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg">${q.dificuldade || 'Média'}</span>
                    </div>
                    
                    <p class="text-slate-200 text-sm md:text-base leading-relaxed whitespace-pre-line">${q.enunciado}</p>
                    
                    <div class="space-y-2 pt-2" id="opcoes-${q.id || index}">
                        ${q.opcoes.map((opt, i) => {
                            const letra = String.fromCharCode(65 + i);
                            return `
                                <label class="flex items-start gap-3 p-3 rounded-xl border border-slate-800/60 bg-slate-950/40 hover:bg-slate-800/40 cursor-pointer transition text-xs md:text-sm">
                                    <input type="radio" name="pergunta-${q.id || index}" value="${letra}" class="mt-0.5 accent-blue-600">
                                    <span class="text-slate-300"><strong class="text-blue-400 mr-1">${letra})</strong> ${opt}</span>
                                </label>`;
                        }).join('')}
                    </div>

                    <div class="flex flex-wrap items-center justify-between pt-3 border-t border-slate-800/80 gap-3">
                        <button onclick="responder('${q.gabarito}', '${q.explicacao}', '${q.id || index}')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-5 py-2.5 rounded-xl transition shadow-lg shadow-emerald-600/20">
                            Responder
                        </button>
                        <div id="resultado-${q.id || index}" class="text-xs"></div>
                    </div>
                </div>
            `).join('');
        }

        function responder(gabaritoCorreto, explicacao, id) {
            const selecionada = document.querySelector(`input[name="pergunta-${id}"]:checked`);
            const divResultado = document.getElementById(`resultado-${id}`);

            if (!selecionada) {
                alert("Selecione uma alternativa antes de responder!");
                return;
            }

            estatisticas.respondidas++;
            if (selecionada.value.trim().toUpperCase() === gabaritoCorreto.trim().toUpperCase()) {
                estatisticas.acertos++;
                divResultado.innerHTML = `<span class="text-emerald-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-check"></i> Correto! Gabarito: ${gabaritoCorreto}</span>`;
            } else {
                divResultado.innerHTML = `<span class="text-red-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> Incorreto. Gabarito: ${gabaritoCorreto}</span>`;
            }

            if (explicacao && explicacao !== "undefined" && explicacao !== "") {
                divResultado.innerHTML += `<div class="text-slate-300 text-xs mt-3 bg-slate-950/80 p-3 rounded-xl border border-slate-800 leading-relaxed"><strong>Comentário:</strong> ${explicacao}</div>`;
            }

            atualizarEstatisticas();
        }

        function atualizarEstatisticas() {
            document.getElementById('stat-respondidas').textContent = estatisticas.respondidas;
            const porc = estatisticas.respondidas > 0 ? Math.round((estatisticas.acertos / estatisticas.respondidas) * 100) : 0;
            document.getElementById('stat-acertos').textContent = porc + '%';
        }

        carregarQuestoes();
    </script>
</body>
</html>
