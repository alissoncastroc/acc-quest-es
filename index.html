<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ACCQuestões - Plataforma de Estudos</title>

<script src="https://cdn.tailwindcss.com"></script>

<link 
    rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
>

</head><body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col"><!-- ========================================= -->
<!-- CABEÇALHO -->
<!-- ========================================= -->

<header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md">

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">

        <div class="flex items-center gap-3">

            <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <div>
                <h1 class="text-xl font-bold tracking-wide">
                    ACCQuestões
                </h1>

                <p class="text-xs text-slate-400">
                    Plataforma de Questões para Concursos
                </p>
            </div>

        </div>


        <!-- ESTATÍSTICAS -->

        <div class="flex gap-4 text-sm bg-slate-900/50 px-4 py-2 rounded-lg border border-slate-700/50">

            <div>
                <span class="text-slate-400">Total:</span>

                <span 
                    id="stat-total" 
                    class="font-bold text-blue-400"
                >
                    0
                </span>
            </div>


            <div>
                <span class="text-slate-400">Respondidas:</span>

                <span 
                    id="stat-respondidas" 
                    class="font-bold text-emerald-400"
                >
                    0
                </span>
            </div>


            <div>
                <span class="text-slate-400">Acertos:</span>

                <span 
                    id="stat-acertos" 
                    class="font-bold text-green-400"
                >
                    0%
                </span>
            </div>

        </div>

    </div>

</header>



<!-- ========================================= -->
<!-- CONTEÚDO PRINCIPAL -->
<!-- ========================================= -->

<main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-6">


    <!-- ========================================= -->
    <!-- FILTROS -->
    <!-- ========================================= -->

    <aside class="lg:col-span-1 bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit space-y-4">


        <h2 class="font-semibold text-lg border-b border-slate-700 pb-2 flex items-center gap-2">

            <i class="fa-solid fa-filter text-blue-500"></i>

            Filtrar Questões

        </h2>



        <!-- DISCIPLINA -->

        <div>

            <label class="block text-xs text-slate-400 mb-1">
                Disciplina
            </label>

            <select 
                id="filtro-disciplina" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200"
            >

                <option value="">
                    Todas as Disciplinas
                </option>

            </select>

        </div>



        <!-- BANCA -->

        <div>

            <label class="block text-xs text-slate-400 mb-1">
                Banca
            </label>

            <select 
                id="filtro-banca" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200"
            >

                <option value="">
                    Todas as Bancas
                </option>

            </select>

        </div>



        <!-- CARGO -->

        <div>

            <label class="block text-xs text-slate-400 mb-1">
                Cargo
            </label>

            <select 
                id="filtro-cargo" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200"
            >

                <option value="">
                    Todos os Cargos
                </option>

            </select>

        </div>



        <!-- DIFICULDADE -->

        <div>

            <label class="block text-xs text-slate-400 mb-1">
                Dificuldade
            </label>

            <select 
                id="filtro-dificuldade" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200"
            >

                <option value="">
                    Todas
                </option>

                <option value="Fácil">
                    Fácil
                </option>

                <option value="Média">
                    Média
                </option>

                <option value="Difícil">
                    Difícil
                </option>

            </select>

        </div>



        <!-- BOTÃO -->

        <button 
            onclick="aplicarFiltros()"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg transition text-sm"
        >

            Filtrar Questões

        </button>


    </aside>



    <!-- ========================================= -->
    <!-- QUESTÕES -->
    <!-- ========================================= -->

    <section 
        class="lg:col-span-3 space-y-6" 
        id="container-questoes"
    >

        <div class="text-center py-12 text-slate-400">

            <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>

            <p>
                Carregando questões da base de dados...
            </p>

        </div>

    </section>


</main>



<!-- ========================================= -->
<!-- RODAPÉ -->
<!-- ========================================= -->

<footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-xs text-slate-500 mt-auto">

    ACCQuestões &copy; 2026 - Todos os direitos reservados.

</footer>



<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->

<script>


    // =========================================
    // API GOOGLE APPS SCRIPT
    // =========================================

    const API_URL = "https://script.google.com/macros/s/AKfycbxQdycxAJzS3zFVO6cMeHI1lIKqPCaVJ4F0746sXxD2ekM5gktWbA9nqL_dxJmOXLPL/exec";



    // =========================================
    // VARIÁVEIS
    // =========================================

    let todasQuestoes = [];

    let questoesFiltradas = [];

    let estatisticas = {
        respondidas: 0,
        acertos: 0
    };



    // =========================================
    // CARREGAR QUESTÕES DA PLANILHA
    // =========================================

    async function carregarQuestoes() {

        try {

            const resposta = await fetch(API_URL);

            if (!resposta.ok) {

                throw new Error(
                    "Erro na API: " + resposta.status
                );

            }


            const respostaAPI = await resposta.json();


            // =====================================
            // VERIFICAR SE A API RETORNOU ERRO
            // =====================================

            if (respostaAPI.sucesso === false) {

                throw new Error(
                    respostaAPI.erro || 
                    "Erro ao carregar os dados"
                );

            }


            // =====================================
            // PEGAR O ARRAY "dados"
            // =====================================

            todasQuestoes = respostaAPI.dados || [];

            questoesFiltradas = [...todasQuestoes];


            // =====================================
            // ATUALIZAR SISTEMA
            // =====================================

            atualizarEstatisticas();

            popularFiltros(todasQuestoes);

            exibirQuestoes(questoesFiltradas);


        } catch (erro) {


            console.error(erro);


            document
                .getElementById(
                    'container-questoes'
                )
                .innerHTML = `

                <div class="bg-red-900/30 border border-red-700 p-6 rounded-xl text-center text-red-300">

                    <i class="fa-solid fa-triangle-exclamation text-3xl mb-3"></i>

                    <p class="font-bold">

                        Erro ao carregar as questões.

                    </p>

                    <p class="text-xs mt-2 text-red-200">

                        ${erro.message}

                    </p>

                    <p class="text-xs mt-2 text-slate-400">

                        Verifique se o Google Apps Script foi implantado como Web App com acesso público.

                    </p>

                </div>

            `;

        }

    }



    // =========================================
    // POPULAR FILTROS
    // =========================================

    function popularFiltros(dados) {


        const disciplinas = [

            ...new Set(

                dados
                    .map(q => q.disciplina)
                    .filter(Boolean)

            )

        ];


        const bancas = [

            ...new Set(

                dados
                    .map(q => q.banca)
                    .filter(Boolean)

            )

        ];


        const cargos = [

            ...new Set(

                dados
                    .map(q => q.cargo)
                    .filter(Boolean)

            )

        ];


        preencherSelect(
            'filtro-disciplina',
            disciplinas
        );


        preencherSelect(
            'filtro-banca',
            bancas
        );


        preencherSelect(
            'filtro-cargo',
            cargos
        );

    }



    // =========================================
    // PREENCHER SELECT
    // =========================================

    function preencherSelect(id, itens) {


        const select =
            document.getElementById(id);


        itens
            .sort((a, b) =>
                String(a).localeCompare(
                    String(b),
                    'pt-BR'
                )
            )
            .forEach(item => {


                const opt =
                    document.createElement(
                        'option'
                    );


                opt.value = item;

                opt.textContent = item;


                select.appendChild(opt);

            });

    }



    // =========================================
    // APLICAR FILTROS
    // =========================================

    function aplicarFiltros() {


        const disc =
            document
                .getElementById(
                    'filtro-disciplina'
                )
                .value;


        const banca =
            document
                .getElementById(
                    'filtro-banca'
                )
                .value;


        const cargo =
            document
                .getElementById(
                    'filtro-cargo'
                )
                .value;


        const dif =
            document
                .getElementById(
                    'filtro-dificuldade'
                )
                .value;



        questoesFiltradas =
            todasQuestoes.filter(q => {


                return (

                    (!disc ||
                        q.disciplina === disc
                    )

                    &&

                    (!banca ||
                        q.banca === banca
                    )

                    &&

                    (!cargo ||
                        q.cargo === cargo
                    )

                    &&

                    (!dif ||
                        q.dificuldade === dif
                    )

                );


            });



        exibirQuestoes(
            questoesFiltradas
        );


    }



    // =========================================
    // EXIBIR QUESTÕES
    // =========================================

    function exibirQuestoes(questoes) {


        const container =
            document.getElementById(
                'container-questoes'
            );


        document
            .getElementById(
                'stat-total'
            )
            .textContent =
                questoes.length;



        // =====================================
        // NENHUMA QUESTÃO
        // =====================================

        if (
            questoes.length === 0
        ) {


            container.innerHTML = `

                <div class="bg-slate-800 p-6 rounded-xl text-center text-slate-400">

                    Nenhuma questão encontrada com esses filtros.

                </div>

            `;


            return;

        }



        // =====================================
        // CRIAR QUESTÕES
        // =====================================

        container.innerHTML =
            questoes
                .map(
                    (q, index) => {


                        const id =
                            q.id || index;


                        const opcoes =
                            Array.isArray(
                                q.opcoes
                            )
                                ? q.opcoes
                                : [];



                        return `

                            <div
                                class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-md"
                                id="questao-${id}"
                            >


                                <!-- ETIQUETAS -->

                                <div class="flex flex-wrap gap-2 mb-3 text-xs">


                                    <span class="bg-blue-900/60 text-blue-300 px-2.5 py-1 rounded-md font-medium">

                                        ${q.disciplina || 'Geral'}

                                    </span>


                                    <span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">

                                        ${q.banca || 'Não informada'}

                                    </span>


                                    <span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">

                                        ${q.cargo || 'Diversos'}

                                    </span>


                                    <span class="bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md">

                                        ${q.dificuldade || 'Média'}

                                    </span>


                                </div>



                                <!-- ENUNCIADO -->

                                <p class="text-slate-200 text-sm md:text-base mb-4 leading-relaxed">

                                    ${q.enunciado || ''}

                                </p>



                                <!-- OPÇÕES -->

                                <div
                                    class="space-y-2 mb-4"
                                    id="opcoes-${id}"
                                >


                                    ${

                                        opcoes
                                            .map(
                                                (
                                                    opt,
                                                    i
                                                ) => {


                                                    const letra =
                                                        String.fromCharCode(
                                                            65 + i
                                                        );


                                                    return `

                                                        <label class="flex items-start gap-3 p-3 rounded-lg border border-slate-700/60 bg-slate-900/40 hover:bg-slate-700/30 cursor-pointer transition text-sm">

                                                            <input
                                                                type="radio"
                                                                name="pergunta-${id}"
                                                                value="${letra}"
                                                                class="mt-1"
                                                            >


                                                            <span>

                                                                <strong>

                                                                    ${letra})

                                                                </strong>

                                                                ${opt}

                                                            </span>

                                                        </label>

                                                    `;


                                                }
                                            )
                                            .join(
                                                ''
                                            )

                                    }


                                </div>



                                <!-- RODAPÉ DA QUESTÃO -->

                                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 pt-3 border-t border-slate-700/50">


                                    <button

                                        onclick="responderPorId('${id}')"

                                        class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium px-4 py-2 rounded-lg transition"

                                    >

                                        Responder

                                    </button>



                                    <div
                                        id="resultado-${id}"
                                        class="text-xs font-semibold"
                                    >

                                    </div>


                                </div>


                            </div>

                        `;


                    }
                )
                .join(
                    ''
                );

    }



    // =========================================
    // RESPONDER POR ID
    // =========================================

    function responderPorId(id) {


        const questao =
            todasQuestoes.find(
                q =>
                    String(q.id) ===
                    String(id)
            )
            ||
            questoesFiltradas.find(
                (
                    q,
                    index
                ) =>
                    String(
                        q.id || index
                    ) ===
                    String(id)
            );


        if (!questao) {

            return;

        }


        responder(
            questao.gabarito,
            questao.explicacao,
            id
        );

    }



    // =========================================
    // RESPONDER QUESTÃO
    // =========================================

    function responder(
        gabaritoCorreto,
        explicacao,
        id
    ) {


        const selecionada =
            document.querySelector(
                `input[name="pergunta-${id}"]:checked`
            );


        const divResultado =
            document.getElementById(
                `resultado-${id}`
            );



        // =====================================
        // VERIFICAR SE MARCOU
        // =====================================

        if (!selecionada) {


            alert(
                "Selecione uma alternativa antes de responder!"
            );


            return;

        }



        // =====================================
        // EVITAR CONTAR DUAS VEZES
        // =====================================

        const questaoElemento =
            document.getElementById(
                `questao-${id}`
            );


        if (
            questaoElemento.dataset.respondida === "true"
        ) {


            return;

        }


        questaoElemento.dataset.respondida =
            "true";



        // =====================================
        // ESTATÍSTICAS
        // =====================================

        estatisticas.respondidas++;



        const respostaUsuario =
            selecionada.value
                .trim()
                .toUpperCase();



        const respostaCorreta =
            String(
                gabaritoCorreto || ''
            )
            .trim()
            .toUpperCase();



        // =====================================
        // ACERTO
        // =====================================

        if (
            respostaUsuario ===
            respostaCorreta
        ) {


            estatisticas.acertos++;


            divResultado.innerHTML = `

                <div class="text-green-400 font-bold">

                    <i class="fa-solid fa-check"></i>

                    Correto!

                    Gabarito:

                    ${respostaCorreta}

                </div>

            `;


        }


        // =====================================
        // ERRO
        // =====================================

        else {


            divResultado.innerHTML = `

                <div class="text-red-400 font-bold">

                    <i class="fa-solid fa-xmark"></i>

                    Incorreto.

                    Gabarito:

                    ${respostaCorreta}

                </div>

            `;


        }



        // =====================================
        // EXPLICAÇÃO
        // =====================================

        if (

            explicacao

            &&

            String(
                explicacao
            )
            .trim() !== ''

            &&

            String(
                explicacao
            )
            !== 'undefined'

        ) {


            divResultado.innerHTML += `

                <div class="text-slate-300 text-xs mt-3 bg-slate-900/80 p-3 rounded-lg border border-slate-700">

                    <strong>

                        Explicação:

                    </strong>

                    <br>

                    ${explicacao}

                </div>

            `;


        }



        atualizarEstatisticas();


    }



    // =========================================
    // ATUALIZAR ESTATÍSTICAS
    // =========================================

    function atualizarEstatisticas() {


        document
            .getElementById(
                'stat-respondidas'
            )
            .textContent =
                estatisticas.respondidas;



        const porcentagem =

            estatisticas.respondidas > 0

                ?

                Math.round(

                    (
                        estatisticas.acertos

                        /

                        estatisticas.respondidas

                    )

                    *

                    100

                )

                :

                0;



        document
            .getElementById(
                'stat-acertos'
            )
            .textContent =
                porcentagem + '%';


    }



    // =========================================
    // INICIAR SISTEMA
    // =========================================

    carregarQuestoes();


</script>

</body>
</html>
